# Blackjackal Chrome Workspace Configuration

# Path to the canonical Chrome workspace
# This contains runtime data and should NOT be committed to git
CHROME_WORKSPACE_PATH=/Users/aribs/.blackjackal-chrome

# Safe paths to sync (metadata only)
ALLOWED_SYNC_PATHS=(
    "Default/Extensions/*/manifest.json"
    "Default/Preferences"
    "Local State"
)

# Sensitive paths that should never be synced
BLOCKED_SYNC_PATHS=(
    "Default/Login Data"
    "Default/Cookies"
    "Default/Web Data"
    "*.pma"
    "*.db"
)

# Sync mode: metadata-only | full (requires review)
SYNC_MODE=metadata-only
